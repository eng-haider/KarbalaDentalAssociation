<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="نقابة أطباء الأسنان – كربلاء المقدسة">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="0.25" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.85" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glowSky)"/>
  <rect width="800" height="1000" fill="url(#glowBlue)"/>

  <!-- soft bokeh circles (photographic depth) -->
  <circle cx="150" cy="180" r="120" fill="#0EA5E9" opacity="0.18"/>
  <circle cx="660" cy="300" r="90" fill="#60A5FA" opacity="0.16"/>
  <circle cx="600" cy="780" r="150" fill="#2563EB" opacity="0.20"/>
  <circle cx="180" cy="820" r="70" fill="#22C55E" opacity="0.12"/>

  <!-- center glass medallion -->
  <g transform="translate(400 470)">
    <circle r="230" fill="#ffffff" opacity="0.04"/>
    <circle r="230" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- crest -->
    <g transform="translate(-95 -120) scale(4)">
      <path d="M24 3 7 9v13c0 11 7.6 18.4 17 23 9.4-4.6 17-12 17-23V9L24 3Z" fill="url(#crest)"/>
      <path d="M24 3 7 9v13c0 11 7.6 18.4 17 23 9.4-4.6 17-12 17-23V9L24 3Z" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.8"/>
      <path d="M24 14c-3.4 0-5.2-2.2-8-2.2-3 0-4.7 2.5-4.7 6 0 2.6 1 4.7 1.8 7.6.6 2.2.7 5.4 2.3 5.4 1.7 0 1.5-3.2 2.4-5.4.6-1.5 1.3-2.4 2.2-2.4s1.6.9 2.2 2.4c.9 2.2.7 5.4 2.4 5.4 1.6 0 1.7-3.2 2.3-5.4.8-2.9 1.8-5 1.8-7.6 0-3.5-1.7-6-4.7-6-2.8 0-4.6 2.2-8 2.2Z" fill="#ffffff"/>
    </g>

    <!-- caption -->
    <text y="150" text-anchor="middle" font-family="Cairo, sans-serif" font-size="34" font-weight="800" fill="#ffffff" direction="rtl">نقابة أطباء الأسنان</text>
    <text y="192" text-anchor="middle" font-family="Cairo, sans-serif" font-size="22" font-weight="600" fill="#0EA5E9" direction="rtl">فرع كربلاء المقدسة</text>
  </g>

  <!-- floating UI chips (suggesting a digital health portal) -->
  <g transform="translate(70 150)">
    <rect width="190" height="64" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="34" cy="32" r="16" fill="#22C55E" opacity="0.22"/>
    <path d="M27 32l4 4 8-8" fill="none" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="22" width="110" height="9" rx="4.5" fill="#ffffff" opacity="0.5"/>
    <rect x="60" y="38" width="74" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  </g>
  <g transform="translate(540 760)">
    <rect width="190" height="64" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="34" cy="32" r="16" fill="#0EA5E9" opacity="0.25"/>
    <path d="M34 24v16M26 32h16" stroke="#0EA5E9" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="60" y="22" width="110" height="9" rx="4.5" fill="#ffffff" opacity="0.5"/>
    <rect x="60" y="38" width="74" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- bottom vignette for badge legibility -->
  <rect x="0" y="760" width="800" height="240" fill="#0F172A" opacity="0.35"/>
</svg>
