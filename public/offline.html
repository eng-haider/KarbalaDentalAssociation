<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لا يوجد اتصال — نقابة أطباء الأسنان كربلاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
        body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
             background:linear-gradient(135deg,#0F172A,#172554,#1E3A8A);color:#fff}
        .card{max-width:28rem}
        .badge{width:88px;height:88px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;
               background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
        h1{font-size:1.6rem;font-weight:800;margin-bottom:12px}
        p{color:#cbd5e1;line-height:1.8;margin-bottom:28px}
        a{display:inline-flex;align-items:center;gap:8px;background:#0EA5E9;color:#fff;text-decoration:none;
          font-weight:700;padding:14px 28px;border-radius:14px;transition:.2s}
        a:hover{background:#0284c7;transform:translateY(-2px)}
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
                <path d="M24 3 7 9v13c0 11 7.6 18.4 17 23 9.4-4.6 17-12 17-23V9L24 3Z" fill="rgba(255,255,255,.2)"/>
                <path d="M24 14c-3.4 0-5.2-2.2-8-2.2-3 0-4.7 2.5-4.7 6 0 2.6 1 4.7 1.8 7.6.6 2.2.7 5.4 2.3 5.4 1.7 0 1.5-3.2 2.4-5.4.6-1.5 1.3-2.4 2.2-2.4s1.6.9 2.2 2.4c.9 2.2.7 5.4 2.4 5.4 1.6 0 1.7-3.2 2.3-5.4.8-2.9 1.8-5 1.8-7.6 0-3.5-1.7-6-4.7-6-2.8 0-4.6 2.2-8 2.2Z" fill="#fff"/>
            </svg>
        </div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالشبكة حالياً. تحقق من اتصالك ثم حاول مرة أخرى للوصول إلى البوابة الرقمية للنقابة.</p>
        <a href="/" onclick="location.reload();return false;">إعادة المحاولة</a>
    </div>
</body>
</html>
